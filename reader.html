<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Reader - MangaVerse</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Set PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header reader-header">
            <div class="logo">
                <h1><a href="index.html" style="color: inherit; text-decoration: none;">📚 MangaVerse</a></h1>
            </div>
            <div class="reader-info">
                <span class="current-chapter" id="currentChapter">Volume 1</span>
                <span class="progress-info" id="progressInfo">Page 1 of 200</span>
            </div>
            <div class="reader-controls">
                <button class="control-btn" onclick="toggleFullscreen()">
                    <i class="fas fa-expand"></i>
                </button>
                <button class="control-btn" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
            </div>
        </header>

        <!-- Reading Toolbar -->
        <div class="reading-toolbar">
            <div class="toolbar-left">
                <button class="toolbar-btn" onclick="previousChapter()" id="prevChapterBtn">
                    <i class="fas fa-chevron-left"></i> Previous Volume
                </button>
                <button class="toolbar-btn" onclick="previousPage()" id="prevPageBtn">
                    <i class="fas fa-arrow-left"></i> Previous Page
                </button>
            </div>
            
            <div class="toolbar-center">
                <div class="chapter-selector">
                    <select id="chapterSelect" onchange="changeChapter(this.value)"></select>
                </div>
                <div class="page-info">
                    <span id="pageInfo">Page 1 of 200</span>
                </div>
            </div>
            
            <div class="toolbar-right">
                <button class="toolbar-btn" onclick="nextPage()" id="nextPageBtn">
                    Next Page <i class="fas fa-arrow-right"></i>
                </button>
                <button class="toolbar-btn" onclick="nextChapter()" id="nextChapterBtn">
                    Next Volume <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- PDF Viewer -->
        <div class="pdf-viewer-container">
            <div class="reading-slot">
                <div class="pdf-viewer" id="pdfViewer">
                    <div class="loading-spinner" id="loadingSpinner">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading manga...</p>
                    </div>
                    <canvas id="pdfCanvas"></canvas>
                </div>
            </div>
        </div>

        <!-- Reading Progress -->
        <div class="reading-progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text">
                <span id="progressText">0% Complete</span>
            </div>
        </div>

        <!-- Enhanced Reading Controls -->
        <div class="reading-controls">
            <button class="reading-control-btn" onclick="toggleFocusMode()" title="Focus Mode">
                <i class="fas fa-eye"></i>
            </button>
            <button class="reading-control-btn" onclick="toggleFullscreen()" title="Fullscreen">
                <i class="fas fa-expand"></i>
            </button>
            <button class="reading-control-btn" onclick="toggleReadingMode()" title="Reading Mode">
                <i class="fas fa-book-open"></i>
            </button>
            <button class="reading-control-btn" onclick="toggleAutoScroll()" title="Auto Scroll">
                <i class="fas fa-scroll"></i>
            </button>
        </div>

        <!-- Reading Mode Indicator -->
        <div class="reading-mode-indicator" id="readingModeIndicator">
            Reading Mode: Single Page
        </div>

        <!-- Reading Settings -->
        <div class="reading-settings" id="readingSettings">
            <div class="settings-panel">
                <h3>Reading Settings</h3>
                <div class="setting-group">
                    <label>Zoom Level:</label>
                    <input type="range" id="zoomSlider" min="50" max="200" value="100" onchange="changeZoom(this.value)">
                    <span id="zoomValue">100%</span>
                </div>
                <div class="setting-group">
                    <label>Reading Mode:</label>
                    <select id="readingMode" onchange="changeReadingMode(this.value)">
                        <option value="single">Single Page</option>
                        <option value="double">Double Page</option>
                        <option value="webtoon">Webtoon</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Auto-scroll:</label>
                    <input type="checkbox" id="autoScroll" onchange="toggleAutoScroll(this.checked)">
                </div>
            </div>
        </div>

        <!-- Floating elements -->
        <div class="floating-elements">
            <div class="floating-sakura">🌸</div>
            <div class="floating-sakura">🌸</div>
            <div class="floating-sakura">🌸</div>
            <div class="floating-sakura">🌸</div>
            <div class="floating-sakura">🌸</div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="manga-config.js"></script>
    <script src="reader.js"></script>
</body>
</html>
