<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaVerse Project Todo List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="todo.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header with anime theme -->
        <header class="header">
            <div class="logo">
                <h1><a href="index.html" style="color: white; text-decoration: none;">📚 MangaVerse</a></h1>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="chapters.html?manga=demon-slayer" class="nav-link">Chapters</a>
                <a href="novels.html" class="nav-link">Novels</a>
                <a href="explore.html" class="nav-link">Explore</a>
                <a href="register.html" class="nav-link">Register</a>
                <a href="#" class="nav-link active">Project Todo</a>
            </nav>
        </header>

        <!-- Main Todo Content -->
        <main class="main-content">
            <!-- Project Overview Section -->
            <section class="project-overview">
                <div class="overview-header">
                    <h2>MangaVerse Development Roadmap</h2>
                    <p>6-Month Project Timeline & Task Management</p>
                    <div class="project-stats">
                        <div class="stat-card">
                            <i class="fas fa-tasks"></i>
                            <span class="stat-number" id="totalTasks">0</span>
                            <span class="stat-label">Total Tasks</span>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-check-circle"></i>
                            <span class="stat-number" id="completedTasks">0</span>
                            <span class="stat-label">Completed</span>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-clock"></i>
                            <span class="stat-number" id="inProgressTasks">0</span>
                            <span class="stat-label">In Progress</span>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-percentage"></i>
                            <span class="stat-number" id="completionRate">0%</span>
                            <span class="stat-label">Progress</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Filter and Add Task Section -->
            <section class="todo-controls">
                <div class="controls-container">
                    <div class="filter-section">
                        <h3>Filter Tasks</h3>
                        <div class="filter-buttons">
                            <button class="filter-btn active" data-filter="all">All Tasks</button>
                            <button class="filter-btn" data-filter="pending">Pending</button>
                            <button class="filter-btn" data-filter="in_progress">In Progress</button>
                            <button class="filter-btn" data-filter="completed">Completed</button>
                            <button class="filter-btn" data-filter="month1">Month 1</button>
                            <button class="filter-btn" data-filter="month2">Month 2</button>
                            <button class="filter-btn" data-filter="month3">Month 3</button>
                            <button class="filter-btn" data-filter="month4">Month 4</button>
                            <button class="filter-btn" data-filter="month5">Month 5</button>
                            <button class="filter-btn" data-filter="month6">Month 6</button>
                        </div>
                    </div>
                    
                    <div class="add-task-section">
                        <h3>Add New Task</h3>
                        <form class="add-task-form" id="addTaskForm">
                            <div class="form-row">
                                <input type="text" id="taskTitle" placeholder="Task title..." required>
                                <select id="taskMonth" required>
                                    <option value="">Select Month</option>
                                    <option value="month1">Month 1 - Foundation</option>
                                    <option value="month2">Month 2 - User System</option>
                                    <option value="month3">Month 3 - Manga Management</option>
                                    <option value="month4">Month 4 - Reading Experience</option>
                                    <option value="month5">Month 5 - Advanced Features</option>
                                    <option value="month6">Month 6 - Deployment</option>
                                </select>
                                <select id="taskPriority">
                                    <option value="low">Low Priority</option>
                                    <option value="medium">Medium Priority</option>
                                    <option value="high">High Priority</option>
                                    <option value="critical">Critical</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <textarea id="taskDescription" placeholder="Task description..."></textarea>
                                <button type="submit" class="add-btn">
                                    <i class="fas fa-plus"></i>
                                    Add Task
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Todo List Section -->
            <section class="todo-list-section">
                <div class="todo-list-container">
                    <h3>Project Tasks</h3>
                    <div class="todo-list" id="todoList">
                        <!-- Tasks will be dynamically added here -->
                    </div>
                </div>
            </section>

            <!-- Timeline Section -->
            <section class="timeline-section">
                <h3>Project Timeline</h3>
                <div class="timeline" id="timeline">
                    <!-- Timeline will be dynamically generated -->
                </div>
            </section>
        </main>

        <!-- Floating elements for anime effect -->
        <div class="floating-elements">
            <div class="floating-sakura">🌸</div>
            <div class="floating-sakura">🌸</div>
            <div class="floating-sakura">🌸</div>
            <div class="floating-sakura">🌸</div>
            <div class="floating-sakura">🌸</div>
        </div>
    </div>

    <!-- Task Edit Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Task</h3>
                <button class="close-btn" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="editTaskForm">
                    <div class="form-group">
                        <label for="editTaskTitle">Task Title</label>
                        <input type="text" id="editTaskTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="editTaskDescription">Description</label>
                        <textarea id="editTaskDescription"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editTaskMonth">Month</label>
                            <select id="editTaskMonth" required>
                                <option value="month1">Month 1 - Foundation</option>
                                <option value="month2">Month 2 - User System</option>
                                <option value="month3">Month 3 - Manga Management</option>
                                <option value="month4">Month 4 - Reading Experience</option>
                                <option value="month5">Month 5 - Advanced Features</option>
                                <option value="month6">Month 6 - Deployment</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="editTaskPriority">Priority</label>
                            <select id="editTaskPriority">
                                <option value="low">Low Priority</option>
                                <option value="medium">Medium Priority</option>
                                <option value="high">High Priority</option>
                                <option value="critical">Critical</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="editTaskStatus">Status</label>
                            <select id="editTaskStatus">
                                <option value="pending">Pending</option>
                                <option value="in_progress">In Progress</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" id="cancelEdit">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="todo.js"></script>
</body>
</html>
